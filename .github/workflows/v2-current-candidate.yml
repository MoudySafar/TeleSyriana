name: TeleSyriana V2 Current Candidate

on:
  pull_request:
    branches:
      - main
    paths:
      - "v2/**"
      - ".github/workflows/v2-current-candidate.yml"
  push:
    branches:
      - main
    paths:
      - "v2/**"
      - ".github/workflows/v2-current-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: v2

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --silent

      - name: Run V2 tests
        run: npm test

      - name: Check canonical server modules
        run: |
          node --check src/candidate-services.js
          node --check src/http/candidate-app.js
          node --check src/http/candidate-platform-current.js
          node --check src/http/serve-current.js
          node --check src/realtime/project-event-broker.js
          node --check src/http/routes/realtime-routes.js
          node --check src/tickets/ticket-assignment-service.js
          node --check src/teams/team-service.js

      - name: Check browser modules
        run: |
          node --check web/app.js
          node --check web/live-events.js
          node --check web/i18n.js
          node --check web/management-tools.js
