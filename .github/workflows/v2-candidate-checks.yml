name: TeleSyriana V2 Candidate Checks

on:
  push:
    branches:
      - development/v2
    paths:
      - "v2/**"
      - ".github/workflows/v2-candidate-checks.yml"
  pull_request:
    paths:
      - "v2/**"
      - ".github/workflows/v2-candidate-checks.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run V2 tests
        run: npm test

      - name: Check server modules
        run: |
          node --check src/http/app-v2.js
          node --check src/http/platform-staging.js
          node --check src/http/serve-staging.js
          node --check src/realtime/project-event-broker.js
          node --check src/http/routes/realtime-routes.js

      - name: Check browser modules
        run: |
          node --check web/app.js
          node --check web/live-events.js
          node --check web/i18n.js
